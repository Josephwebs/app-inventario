<ion-menu menuId="second-menu" contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Administracion</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding"> </ion-content>
</ion-menu>

<ion-menu type="reveal" menuId="fourth-menu" contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu Principal</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <ion-button
      expand="block"
      color="ion-color-warning"
      class="primario-bg-button"
      >Inicio</ion-button
    >
    <ion-button
      (click)="ventas()"
      expand="block"
      color="ion-color-warning"
      class="primario-bg-button"
      >Ventas</ion-button
    >
    <ion-button
      expand="block"
      color="ion-color-warning"
      class="primario-bg-button"
      >Informes</ion-button
    >
    <ion-button
      expand="block"
      color="ion-color-warning"
      class="primario-bg-button"
      >Inventario</ion-button
    >
  </ion-content>
</ion-menu>

<ion-menu side="end" contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Administracion / Empresa</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-button
      expand="block"
      color="ion-color-warning"
      class="primario-bg-button"
      >Registrar usuario</ion-button
    >
    <ion-button
      expand="block"
      color="ion-color-warning"
      class="primario-bg-button"
      >Registro Producto</ion-button
    >
    <ion-button
      expand="block"
      color="ion-color-warning"
      class="primario-bg-button"
      >Editar Producto</ion-button
    >
    <ion-button
      expand="block"
      color="ion-color-warning"
      class="primario-bg-button"
      >Cambiar Folio</ion-button
    >
    <ion-button
      expand="block"
      color="ion-color-warning"
      class="primario-bg-button"
      >Informacion empresa</ion-button
    >
  </ion-content>
</ion-menu>

<ion-content
  [fullscreen]="true"
  class="ion-padding magnolia ion-page"
  id="main-content"
>
  <center>
    <img class="logo" src="../../../assets/img/logo.png" alt="monster inc" />
    <h1 style="text-shadow: 2px 2px 5px #000000">Bienvenido</h1>

    <h1 style="text-shadow: 2px 2px 5px #000000">{{nombre}}</h1>
  </center>
  <ion-button
    (click)="openFourthMenu()"
    expand="block"
    color="ion-color-warning"
    class="primario-bg-button"
    >Menu Principal</ion-button
  >
  <ion-button
    *ngIf="rol === 3"
    (click)="openEndMenu()"
    expand="block"
    color="ion-color-warning"
    class="primario-bg-button"
    >Administracion / Empresa</ion-button
  >
  <ion-button
    (click)="cerrarSesion()"
    expand="block"
    color="ion-color-warning"
    class="primario-bg-button"
    >Cerrar Sesión</ion-button
  >
</ion-content>
